services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nabd
      POSTGRES_USER: nabd_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - nabd_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nabd_app -d nabd"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  nabd_postgres:
